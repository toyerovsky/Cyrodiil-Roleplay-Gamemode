name: cyrodiilrp

services:
  postgres:
    image: postgres:18
    container_name: cyrodiilrp-postgres
    environment:
      POSTGRES_DB: cyrodiilrp
      POSTGRES_USER: cyrodiilrp
      POSTGRES_PASSWORD: cyrodiilrp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cyrodiilrp-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyrodiilrp -d cyrodiilrp"]
      interval: 5s
      retries: 10

volumes:
  cyrodiilrp-postgres:
